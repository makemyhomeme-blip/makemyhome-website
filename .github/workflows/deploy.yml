name: Deploy na makemyhome.me

# Zasto ovo postoji
# -----------------
# Sync se do sada pokretao rucno: procitaj admin lozinku preko cPanel API-ja,
# prijavi se u admin, pozovi sync.php. Sve to je isao sa jedne masine. Kad je
# zastita hostinga blokirala tu adresu (previse zahtjeva u kratkom roku), deploy
# je stao — kod je bio na GitHubu, a sajt je danima nosio staru verziju.
#
# Ovaj posao radi isto to, ali sa GitHub-ove masine. Ona ima svoju adresu i nije
# blokirana. Pokrece se sam pri svakom push-u na radnu granu, a moze i rucno
# (Actions -> Deploy na makemyhome.me -> Run workflow).
#
# Pristupni podaci se NE upisuju ovdje — citaju se iz CLAUDE.md, gdje vec stoje.

on:
  push:
    branches: [claude/build-product-website-6CvHG]
  workflow_dispatch:

concurrency:
  group: deploy-makemyhome
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Sacekaj GitHub CDN
        # sync.php povlaci fajlove sa raw.githubusercontent.com. CDN kesira po
        # cvorovima, pa odmah poslije push-a jos umije da vrati prethodnu verziju.
        run: sleep 60

      - name: Prijava u admin i sync
        env:
          ADMIN_LOZINKA: ${{ secrets.MMH_ADMIN_PASS }}
          # Ako se kljuc promijeni, dodaj tajnu MMH_SYNC_KEY; inace vazi zatecena.
          SYNC_KLJUC: ${{ secrets.MMH_SYNC_KEY || 'mkhsync2025' }}
        run: |
          set -euo pipefail

          # Lozinka admina dolazi iz GitHub Secrets (Settings -> Secrets and
          # variables -> Actions -> New repository secret -> MMH_ADMIN_PASS).
          #
          # Ranije se citala sa servera preko cPanel API-ja. To vise ne radi:
          # hosting je ispred cPanela stavio provjeru koja trazi izvrsavanje
          # JavaScripta ("One moment, please..."), pa svaki poziv iz skripte —
          # i sa GitHub-ove masine — dobije tu stranicu umjesto odgovora.
          # Uz to, lozinke ne treba da stoje u fajlu u repou.
          ADMIN="${ADMIN_LOZINKA:-}"
          if [ -z "$ADMIN" ]; then
            echo "::error::Nema tajne MMH_ADMIN_PASS."
            echo "Dodaj je jednom: GitHub -> Settings -> Secrets and variables -> Actions"
            echo "-> New repository secret -> ime: MMH_ADMIN_PASS, vrijednost: lozinka admin panela."
            echo "Poslije toga svaki push sam deployuje sajt."
            exit 1
          fi
          echo "::add-mask::$ADMIN"

          echo "1/3  prijava u admin"
          curl -sS -c /tmp/ck.txt -X POST "https://makemyhome.me/admin/index.php" \
            --data-urlencode "username=admin" --data-urlencode "password=$ADMIN" \
            -L -o /dev/null --max-time 40

          echo "2/3  sync"
          curl -sS -b /tmp/ck.txt "https://makemyhome.me/admin/sync.php?key=${SYNC_KLJUC}" \
            --max-time 600 -o /tmp/sync.html
          sed -e 's/<[^>]*>//g' /tmp/sync.html | grep -vE '^[[:space:]]*$' | tail -40 || true

          if ! grep -q 'ažurirano' /tmp/sync.html; then
            echo "sync nije javio da je zavrsio"; exit 1
          fi

          # Ako se mijenjao sam sync.php, prvi prolaz ga tek postavi — drugi ga koristi.
          if grep -q 'admin/sync.php.*OK' /tmp/sync.html 2>/dev/null; then
            echo "     sync.php je azuriran, pokrecem jos jednom"
            sleep 5
            curl -sS -b /tmp/ck.txt "https://makemyhome.me/admin/sync.php?key=${SYNC_KLJUC}" \
              --max-time 600 -o /tmp/sync2.html
            grep -q 'ažurirano' /tmp/sync2.html || { echo "drugi prolaz nije zavrsio"; exit 1; }
          fi

          echo "3/3  provjera na zivom sajtu"
          for U in / /kategorija/3d-letvice /paneli/3d-letvica-deva /products.html /cjenovnik.html; do
            K=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "https://makemyhome.me$U")
            echo "     $K  $U"
            test "$K" = "200"
          done

          echo "     kisobran kategorija ne smije nabrajati proizvode"
          curl -sS --max-time 30 "https://makemyhome.me/kategorija/bambus-paneli" -o /tmp/bp.html
          # `grep` vrati 1 kad nema pogodaka, a uz `pipefail` to obara cijeli
          # posao — bas u slucaju kad je rezultat ISPRAVAN (nula kartica).
          BR=$(grep -c 'class="product-card' /tmp/bp.html || true)
          echo "     kartica proizvoda na /kategorija/bambus-paneli: $BR"
          test "$BR" -eq 0

          echo "DEPLOY GOTOV"
