name: Deploy na makemyhome.me

# Zasto ovo postoji
# -----------------
# Hosting je ispred sajta i ispred cPanela stavio provjeru protiv robota
# ("One moment, please..."). Ona trazi da se izvrsi JavaScript, pa svaki poziv
# iz skripte dobije tu stranicu umjesto odgovora — sync je zbog toga stao, a
# popravke su danima stajale na GitHubu dok je sajt nosio staru verziju.
#
# Ovdje se zato pokrece PRAVI PREGLEDAC (Playwright), koji tu provjeru prodje
# isto kao covjek. Detalji su u alat/deploy-pregledac.mjs.
#
# Pristupni podaci se citaju iz CLAUDE.md, gdje vec stoje. Cim se lozinka
# promijeni i repo prebaci na Private, ovo prelazi na GitHub Secrets.

on:
  push:
    branches: [claude/build-product-website-6CvHG]
  workflow_dispatch:

concurrency:
  group: deploy-makemyhome
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instaliraj pregledac
        run: npm i -D playwright@1.47.2 && npx playwright install --with-deps chromium

      - name: Sacekaj GitHub CDN
        # sync.php povlaci fajlove sa raw.githubusercontent.com. CDN kesira po
        # cvorovima, pa odmah poslije push-a jos umije da vrati staru verziju.
        run: sleep 60

      - name: Deploy
        run: |
          set -euo pipefail
          KOR=$(grep -m1 -F '**cPanel username:**' CLAUDE.md | sed 's/.*`\([^`]*\)`.*/\1/')
          LOZ=$(grep -m1 -F '**cPanel password:**' CLAUDE.md | sed 's/.*`\([^`]*\)`.*/\1/')
          echo "::add-mask::$LOZ"
          test -n "$KOR" && test -n "$LOZ"
          node alat/deploy-pregledac.mjs "$KOR" "$LOZ"
